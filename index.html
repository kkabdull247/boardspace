<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Boards — Visual Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
:root{
  --bg:#eceef0; --panel:#ffffff; --line:#e3e6ea; --line2:#eef0f2;
  --text:#1f2937; --muted:#8b93a1; --accent:#5b6cff; --accent2:#2bb6a3;
  --radius:12px; --shadow:0 2px 10px rgba(20,24,34,.06),0 1px 2px rgba(20,24,34,.05);
  --shadow-lg:0 14px 34px rgba(20,24,34,.14);
  --canvas-dot:#d7dbe0; --header:#fbfbfc; --input:#f6f7f9; --danger:#dc3545;
}
body.dark{
  --bg:#111318; --panel:#181b22; --line:#2a2f3a; --line2:#222733;
  --text:#eef2f7; --muted:#929aaa; --accent:#7c8cff; --accent2:#36c7b1;
  --shadow:0 2px 12px rgba(0,0,0,.25),0 1px 2px rgba(0,0,0,.2);
  --shadow-lg:0 16px 40px rgba(0,0,0,.45);
  --canvas-dot:#303541; --header:#1d2028; --input:#20242d;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;
  padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#707784;border-radius:8px;}
button{font-family:inherit;}

#app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

/* TOPBAR */
#topbar{height:54px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 16px;
  background:var(--panel);border-bottom:1px solid var(--line);z-index:50;}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#8f6bff);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;flex-shrink:0;}
#menuToggle{display:none;}
.crumbs{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--muted);overflow:hidden;white-space:nowrap;}
.crumbs b{color:var(--text);cursor:pointer;font-weight:600;}
.crumbs b:hover{text-decoration:underline;}
.crumbs span.sep{opacity:.5;font-weight:400;}
.topbar-right{display:flex;align-items:center;gap:6px;margin-left:auto;}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid transparent;background:transparent;
  color:#596170;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;}
.icon-btn:hover{background:var(--line2);}
.topbar-search{display:flex;align-items:center;gap:6px;background:var(--line2);border-radius:9px;padding:0 10px;
  height:34px;width:0;overflow:hidden;transition:width .2s;}
.topbar-search.open{width:200px;padding:0 10px;}
.topbar-search input{border:0;background:transparent;outline:0;font-size:13px;width:100%;color:var(--text);}

/* LAYOUT */
#body{flex:1;display:flex;min-height:0;position:relative;}

/* LEFT RAIL */
#rail{width:78px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px;overflow-y:auto;z-index:45;
  transition:transform .25s ease;}
.rail-btn{width:54px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 0;
  border-radius:10px;cursor:pointer;color:#596170;position:relative;flex-shrink:0;}
.rail-btn:hover{background:var(--line2);}
.rail-btn .ic{width:34px;height:34px;border-radius:9px;background:var(--panel);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);font-size:15px;}
.rail-btn .lb{font-size:10px;font-weight:500;}
.rail-spacer{flex:1;}
.rail-btn.trash{margin-bottom:4px;}
#moreBtn.open .ic, #moreBtn.active .ic{background:#eef0ff;border-color:#c9cfff;color:var(--accent);}

#morePanel{position:absolute;left:84px;top:300px;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;box-shadow:var(--shadow-lg);padding:10px;display:none;grid-template-columns:repeat(3,64px);gap:4px;z-index:60;}
#morePanel.open{display:grid;}
.more-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border-radius:10px;cursor:pointer;}
.more-item:hover{background:var(--line2);}
.more-item .ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;}
.more-item .lb{font-size:10.5px;color:#596170;font-weight:500;}

/* CANVAS */
#canvasWrap{flex:1;position:relative;overflow:hidden;background:
  radial-gradient(circle at 1px 1px, var(--canvas-dot) 1.4px, transparent 1.4px) 0 0/24px 24px, var(--bg);
  touch-action:none;}
#canvas{position:absolute;top:0;left:0;transform-origin:0 0;width:7000px;height:5000px;}
#lineLayer{position:absolute;top:0;left:0;width:7000px;height:5000px;pointer-events:none;}

.unsorted-badge{position:absolute;top:14px;right:16px;background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;color:#596170;box-shadow:var(--shadow);
  z-index:20;cursor:pointer;}
.unsorted-badge:hover{background:var(--line2);}

.zoompill{position:absolute;left:16px;bottom:16px;display:flex;align-items:center;gap:2px;background:var(--panel);
  border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:var(--shadow);z-index:20;}
.zoompill button{width:28px;height:28px;border:0;background:transparent;border-radius:999px;cursor:pointer;font-size:14px;color:#596170;}
.zoompill button:hover{background:var(--line2);}
.zoompill span{font-size:11.5px;color:var(--muted);width:42px;text-align:center;}

/* CARDS */
.card{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);min-width:170px;min-height:64px;display:flex;flex-direction:column;overflow:hidden;}
.card.dragging{box-shadow:var(--shadow-lg);z-index:999 !important;}
.card .ch{display:flex;align-items:center;gap:6px;padding:7px 9px;cursor:grab;border-bottom:1px solid var(--line2);
  background:var(--header);}
.card .ch:active{cursor:grabbing;}
.card .ch .tag{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;flex:1;font-weight:600;}
.card .ch .act{opacity:0;display:flex;gap:2px;}
.card:hover .ch .act{opacity:1;}
.card .ch .act button{width:22px;height:22px;border:0;background:transparent;color:#9aa1ad;border-radius:6px;cursor:pointer;font-size:12px;}
.card .ch .act button:hover{background:var(--line2);color:var(--text);}
.card .swatch-bar{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.card .body{flex:1;overflow:auto;padding:10px 12px;font-size:13.5px;line-height:1.55;color:var(--text);}
.card .body[contenteditable]:focus{outline:none;}
.card .body:empty:before{content:attr(data-ph);color:#b7bcc4;}
.card.heading .body{font-size:20px;font-weight:700;}
.card.image .body,.card.video .body{padding:0;position:relative;}
.card.image img, .card.video video{width:100%;height:100%;object-fit:cover;display:block;}
.card .caption{padding:6px 10px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line2);}

.todo-row{display:flex;align-items:flex-start;gap:7px;margin-bottom:6px;}
.todo-row input[type=checkbox]{margin-top:3px;accent-color:var(--accent);width:15px;height:15px;}
.todo-row span[contenteditable]{flex:1;outline:none;}
.todo-row.done span{color:#b7bcc4;text-decoration:line-through;}
.add-todo{font-size:12px;color:var(--muted);cursor:pointer;margin-top:2px;}
.add-todo:hover{color:var(--accent);}

.card.link .body{display:flex;flex-direction:column;gap:3px;}
.card.link a{color:var(--accent);text-decoration:none;font-weight:600;word-break:break-all;}
.link-input{display:flex;gap:6px;padding:10px;}
.link-input input{flex:1;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12.5px;outline:none;}
.link-input input:focus{border-color:var(--accent);}
.link-input button{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;}

.card.embed iframe, .card.embed .mapbox{width:100%;height:100%;border:0;display:block;}
.youtube-player{position:relative;width:100%;height:100%;background:#0b0b0d;}
.youtube-player iframe{position:absolute;inset:0;}
.youtube-fallback{position:absolute;left:10px;right:10px;bottom:10px;display:flex;align-items:center;gap:8px;padding:7px 9px;background:rgba(15,15,18,.92);color:#fff;border-radius:8px;font-size:11px;z-index:3;box-shadow:0 5px 18px rgba(0,0,0,.25);}
.youtube-fallback i{color:#ff0033;font-size:16px;}
.youtube-fallback span{flex:1;}
.youtube-fallback a{color:#fff;background:#ff0033;text-decoration:none;border-radius:6px;padding:5px 8px;font-weight:700;}
.youtube-fallback.hidden{display:none;}
.card.embed .body{padding:0;position:relative;}
.map-tools{position:absolute;top:6px;left:6px;right:6px;display:flex;gap:6px;z-index:5;}
.map-tools button{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-size:11px;
  font-weight:600;cursor:pointer;box-shadow:var(--shadow);color:#596170;}
.map-tools button:hover{color:var(--accent);}

.card.boardlink{cursor:pointer;}
.board-card-head{display:flex;align-items:center;gap:6px;padding:7px 9px;border-bottom:1px solid var(--line2);background:var(--header);cursor:grab;}
.board-card-head .board-tag{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;flex:1;}
.board-card-head .board-actions{display:flex;gap:2px;}
.board-card-head button{width:22px;height:22px;border:0;background:transparent;color:#9aa1ad;border-radius:6px;cursor:pointer;font-size:12px;}
.board-card-head button:hover{background:var(--line2);color:var(--text);}
.board-card-head button.delete-board:hover{color:var(--danger);}
.card.boardlink .body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;}
.card.boardlink .bthumb{width:54px;height:54px;border-radius:12px;background:var(--input);display:flex;align-items:center;
  justify-content:center;font-size:22px;}
.card.boardlink .btitle{font-weight:700;font-size:13.5px;outline:none;text-align:center;width:100%;}
.card.boardlink .bcount{font-size:11px;color:var(--muted);}

.card.audio .body{display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;padding:14px;}
.card.audio audio{width:100%;}
.card.document .body{display:flex;align-items:center;gap:10px;padding:12px;}
.card.document .fico{width:38px;height:38px;border-radius:9px;background:#fdeeea;color:#e2643f;display:flex;
  align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.card.comment .body{display:flex;flex-direction:column;gap:6px;}
.comment-item{background:var(--input);border-radius:9px;padding:6px 9px;font-size:12.5px;}
.comment-add{display:flex;gap:6px;}
.comment-add input{flex:1;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;outline:none;}

.card.column .body{display:flex;flex-direction:column;gap:6px;}
.col-chip{background:var(--input);border:1px solid var(--line2);border-radius:8px;padding:6px 8px;font-size:12.5px;outline:none;}
.col-add{font-size:12px;color:var(--muted);cursor:pointer;}
.col-add:hover{color:var(--accent);}

.card.color .body{padding:0;}

.card.sketch .body{padding:0;position:relative;background:var(--panel);}
.sketch-tools{position:absolute;top:6px;left:6px;right:6px;display:flex;align-items:center;gap:6px;z-index:6;
  background:color-mix(in srgb, var(--panel) 92%, transparent);border-radius:9px;padding:4px 6px;box-shadow:var(--shadow);}
.sketch-tools .sw{width:17px;height:17px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex-shrink:0;}
.sketch-tools .sw.sel{border-color:#333;}
.sketch-tools input[type=range]{width:46px;}
.sketch-tools button{border:0;background:transparent;font-size:12px;cursor:pointer;color:#596170;padding:2px 4px;}
.sketch-tools button:hover{color:var(--accent);}
.sketchCanvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair;}

.resize{position:absolute;right:0;bottom:0;width:17px;height:17px;cursor:nwse-resize;z-index:5;}
.resize:after{content:'';position:absolute;right:5px;bottom:5px;width:7px;height:7px;
  border-right:2px solid #c3c8d0;border-bottom:2px solid #c3c8d0;}

.modal-bg{position:fixed;inset:0;background:rgba(20,24,34,.4);z-index:100;display:none;align-items:center;justify-content:center;padding:16px;}
.modal-bg.open{display:flex;}
.modal{background:var(--panel);border-radius:16px;width:100%;max-width:420px;max-height:80vh;
  display:flex;flex-direction:column;box-shadow:var(--shadow-lg);}
.modal h3{margin:0;padding:16px;border-bottom:1px solid var(--line);font-size:15px;}
.modal .mbody{padding:12px 16px;overflow-y:auto;}
.modal .mfoot{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;
  padding:7px 13px;font-size:13px;font-weight:600;}
.btn:hover{background:var(--line2);}
.trash-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13px;}

.toast{position:fixed;bottom:18px;right:18px;background:#1f2937;color:#fff;padding:10px 16px;border-radius:10px;
  font-size:13px;box-shadow:var(--shadow-lg);z-index:200;opacity:0;transform:translateY(8px);transition:all .25s;}
.toast.show{opacity:1;transform:translateY(0);}

#railScrim{display:none;}
@media(max-width:860px){
  #rail{position:fixed;top:54px;bottom:0;left:0;transform:translateX(-100%);width:78px;box-shadow:var(--shadow-lg);}
  #rail.open{transform:translateX(0);}
  #railScrim{display:none;position:fixed;inset:0;top:54px;background:rgba(0,0,0,.3);z-index:39;}
  #railScrim.open{display:block;}
  #menuToggle{display:inline-flex;}
  #morePanel{left:84px;top:200px;grid-template-columns:repeat(3,56px);}
  .more-item .ic{width:34px;height:34px;}
}


.icon-btn i,.rail-btn i,.more-item i{font-size:14px;line-height:1;}
.danger-btn{color:var(--danger)!important;}
.theme-toggle{position:relative;}
.storage-note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.4;}
.trash-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);}
.trash-head h3{padding:0!important;border:0!important;}
.empty-state{padding:24px 10px;text-align:center;color:var(--muted);font-size:13px;}
.file-progress{font-size:11px;color:var(--muted);margin-top:5px;}
@media(max-width:520px){
  .card .ch .act{opacity:1;}
  .board-card-head .board-actions{opacity:1;}
  #topbar{padding:0 8px;gap:6px;height:52px;}
  .logo{width:27px;height:27px;}
  .crumbs{font-size:12px;max-width:38vw;}
  .topbar-right{gap:2px;}
  .icon-btn{width:32px;height:32px;}
  .topbar-search.open{position:absolute;left:8px;right:8px;top:58px;width:auto;height:38px;z-index:80;}
  .modal-bg{padding:8px;}
  .modal{max-height:88vh;border-radius:12px;}
}
@media(max-width:360px){
  #topbar{padding:0 5px;}
  .crumbs{max-width:34vw;}
  .crumbs b:last-child{max-width:80px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:bottom;}
  .topbar-right .icon-btn:nth-child(1){display:none;}
  .rail{width:72px!important;}
  .rail-btn{width:50px;}
}

</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <button id="menuToggle" class="icon-btn" onclick="toggleRail()" title="Menu"><i class="fa-solid fa-bars"></i></button>
    <div class="logo">M</div>
    <div class="crumbs" id="crumbs"></div>
    <div class="topbar-right">
      <div class="topbar-search" id="searchBox"><i class="fa-solid fa-magnifying-glass"></i><input id="searchInput" placeholder="Search…" oninput="doSearch(this.value)"></div>
      <button class="icon-btn" onclick="toggleSearch()" title="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
      <button class="icon-btn danger-btn" onclick="openTrash()" title="Trash"><i class="fa-solid fa-trash-can"></i></button>
      <button class="icon-btn danger-btn" onclick="cleanCurrentBoard()" title="Clean current board"><i class="fa-solid fa-broom"></i></button>
      <button class="icon-btn theme-toggle" id="themeBtn" onclick="toggleTheme()" title="Toggle dark/light mode"><i class="fa-solid fa-moon"></i></button>
    </div>
  </div>

  <div id="body">
    <div id="railScrim" onclick="toggleRail()"></div>
    <aside id="rail">
      <div class="rail-btn" onclick="addCard('note')"><div class="ic"><i class="fa-regular fa-note-sticky"></i></div><div class="lb">Note</div></div>
      <div class="rail-btn" onclick="addCard('link')"><div class="ic"><i class="fa-solid fa-link"></i></div><div class="lb">Link</div></div>
      <div class="rail-btn" onclick="addCard('todo')"><div class="ic"><i class="fa-regular fa-square-check"></i></div><div class="lb">To-do</div></div>
      <div class="rail-btn" onclick="startLineMode()" id="lineBtn"><div class="ic"><i class="fa-solid fa-arrow-up-right-from-square"></i></div><div class="lb">Line</div></div>
      <div class="rail-btn" onclick="addCard('board')"><div class="ic" style="background:#5b6cff;color:#fff;"><i class="fa-solid fa-table-cells-large"></i></div><div class="lb">Board</div></div>
      <div class="rail-btn" onclick="addCard('column')"><div class="ic"><i class="fa-solid fa-bars-staggered"></i></div><div class="lb">Column</div></div>
      <div class="rail-btn" onclick="addCard('comment')"><div class="ic"><i class="fa-regular fa-comment"></i></div><div class="lb">Comment</div></div>
      <div class="rail-btn" onclick="addCard('table')"><div class="ic"><i class="fa-solid fa-table"></i></div><div class="lb">Table</div></div>
      <div class="rail-btn" id="moreBtn" onclick="toggleMore()"><div class="ic"><i class="fa-solid fa-ellipsis"></i></div><div class="lb">More</div></div>
      <div class="rail-btn" onclick="pickImage()"><div class="ic"><i class="fa-regular fa-image"></i></div><div class="lb">Add image</div></div>
      <div class="rail-btn" onclick="pickUpload()"><div class="ic"><i class="fa-regular fa-file"></i></div><div class="lb">Upload</div></div>
      <div class="rail-btn" onclick="addCard('sketch')"><div class="ic"><i class="fa-solid fa-pen"></i></div><div class="lb">Draw</div></div>
      <div class="rail-spacer"></div>
    </aside>

    <div id="morePanel">
      <div class="more-item" onclick="addCard('sketch')"><div class="ic" style="background:#374151;"><i class="fa-solid fa-pen"></i></div><div class="lb">Sketch</div></div>
      <div class="more-item" onclick="addCard('color')"><div class="ic" style="background:linear-gradient(135deg,#f472b6,#2bb6a3);"><i class="fa-solid fa-palette"></i></div><div class="lb">Color</div></div>
      <div class="more-item" onclick="pickUpload()"><div class="ic" style="background:#60a5fa;"><i class="fa-regular fa-file"></i></div><div class="lb">Document</div></div>
      <div class="more-item" onclick="pickAudio()"><div class="ic" style="background:#34d399;"><i class="fa-solid fa-music"></i></div><div class="lb">Audio</div></div>
      <div class="more-item" onclick="addCard('map')"><div class="ic" style="background:#2bb6a3;"><i class="fa-solid fa-location-dot"></i></div><div class="lb">Map</div></div>
      <div class="more-item" onclick="pickVideo()"><div class="ic" style="background:#a78bfa;"><i class="fa-brands fa-youtube"></i></div><div class="lb">Video</div></div>
      <div class="more-item" onclick="addCard('heading')"><div class="ic" style="background:#9ca3af;">T</div><div class="lb">Heading</div></div>
    </div>

    <div id="canvasWrap">
      <div class="unsorted-badge" id="unsortedBadge" onclick="tidyUp()">0 Unsorted</div>
      <svg id="lineLayer"></svg>
      <div id="canvas"></div>
      <div class="zoompill">
        <button onclick="zoomBy(-0.1)">−</button>
        <span id="zoomLbl">100%</span>
        <button onclick="zoomBy(0.1)">+</button>
        <button onclick="resetView()" title="Reset view">⤢</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-bg" id="trashModal">
  <div class="modal">
    <div class="trash-head">
      <h3>Trash</h3>
      <button class="btn danger-btn" onclick="deleteAllTrash()" title="Permanently delete everything in trash">
        <i class="fa-solid fa-trash-can"></i> Delete All
      </button>
    </div>
    <div class="mbody" id="trashBody"></div>
    <div class="mfoot">
      <button class="btn" onclick="closeModal('trashModal')">Close</button>
    </div>
  </div>
</div>

<input type="file" id="fileImage" accept="image/*" style="display:none">
<input type="file" id="fileUpload" style="display:none">
<input type="file" id="fileAudio" accept="audio/*" style="display:none">
<input type="file" id="fileVideo" accept="video/*" style="display:none">

<div class="toast" id="toast"></div>

<script>
/* ---------- STATE ---------- */
const COLORS=['#5b6cff','#2bb6a3','#34d399','#fbbf24','#f87171','#f472b6','#60a5fa','#a78bfa'];
let state = load() || { boards:[ mkBoard('Home', null) ], currentId:null, trash:[] };
if(!state.currentId) state.currentId = state.boards[0].id;
let view = {x:40,y:20,scale:1};
let lineMode=false, lineFrom=null;

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function mkBoard(name,parentId){return {id:uid(),name,parentId,cards:[],lines:[],view:{x:40,y:20,scale:1}};}
function save(){
  try{ localStorage.setItem('boards_app_v2', JSON.stringify(state)); }
  catch(e){ console.warn('Workspace metadata could not be saved:',e); toast('Workspace storage is full. Large files are stored separately.'); }
}
function load(){try{return JSON.parse(localStorage.getItem('boards_app_v2'));}catch(e){return null;}}

/* ---------- FILE STORAGE (IndexedDB) ---------- */
const FILE_DB='boards_file_store_v1', FILE_STORE='files';
let fileDBPromise=null;
function openFileDB(){
  if(fileDBPromise) return fileDBPromise;
  fileDBPromise=new Promise((resolve,reject)=>{
    const req=indexedDB.open(FILE_DB,1);
    req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(FILE_STORE)) req.result.createObjectStore(FILE_STORE);};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
  return fileDBPromise;
}
async function storeFile(file){
  const db=await openFileDB();
  const id=uid();
  await new Promise((resolve,reject)=>{
    const tx=db.transaction(FILE_STORE,'readwrite');
    tx.objectStore(FILE_STORE).put({blob:file,name:file.name,type:file.type,size:file.size},id);
    tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error);
  });
  return id;
}
async function getStoredFile(id){
  if(!id) return null;
  try{
    const db=await openFileDB();
    return await new Promise((resolve,reject)=>{
      const req=db.transaction(FILE_STORE,'readonly').objectStore(FILE_STORE).get(id);
      req.onsuccess=()=>resolve(req.result||null); req.onerror=()=>reject(req.error);
    });
  }catch(e){return null;}
}
async function deleteStoredFile(id){
  if(!id) return;
  try{
    const db=await openFileDB();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(FILE_STORE,'readwrite'); tx.objectStore(FILE_STORE).delete(id);
      tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error);
    });
  }catch(e){}
}
async function clearStoredFiles(){
  try{
    const db=await openFileDB();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(FILE_STORE,'readwrite'); tx.objectStore(FILE_STORE).clear();
      tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error);
    });
  }catch(e){}
}
async function mediaURL(c){
  if(c.fileId){
    const item=await getStoredFile(c.fileId);
    if(item?.blob) return URL.createObjectURL(item.blob);
  }
  return c.src||'';
}
function cleanupMediaURL(el){
  if(el && el.dataset.blobUrl) URL.revokeObjectURL(el.dataset.blobUrl);
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),2000);}
function getBoard(id){return state.boards.find(b=>b.id===id);}
function currentBoard(){return getBoard(state.currentId);}

/* ---------- TOPBAR / NAV ---------- */
function renderCrumbs(){
  const b=currentBoard(); const chain=[b];
  let p=b.parentId?getBoard(b.parentId):null;
  while(p){chain.unshift(p); p=p.parentId?getBoard(p.parentId):null;}
  document.getElementById('crumbs').innerHTML=chain.map((c,i)=>
    (i>0?'<span class="sep">/</span>':'')+`<b onclick="openBoard('${c.id}')">${esc(c.name)}</b>`
  ).join('');
}
function openBoard(id){
  state.currentId=id;
  const b=currentBoard();
  view = b.view || {x:40,y:20,scale:1};
  save(); applyTheme(); renderCrumbs(); renderAll(); applyView(); closeRailMobile();
}
function toggleRail(){document.getElementById('rail').classList.toggle('open');document.getElementById('railScrim').classList.toggle('open');}
function closeRailMobile(){if(window.innerWidth<=860){document.getElementById('rail').classList.remove('open');document.getElementById('railScrim').classList.remove('open');}}
function toggleSearch(){document.getElementById('searchBox').classList.toggle('open');}
function doSearch(v){
  v=v.trim().toLowerCase();
  document.querySelectorAll('#canvas .card').forEach(el=>{
    const match=!v || el.textContent.toLowerCase().includes(v);
    el.style.opacity=match?'1':'.15';
  });
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- VIEW (pan/zoom) ---------- */
function applyView(){
  document.getElementById('canvas').style.transform=`translate(${view.x}px,${view.y}px) scale(${view.scale})`;
  document.getElementById('lineLayer').style.transform=`translate(${view.x}px,${view.y}px) scale(${view.scale})`;
  document.getElementById('zoomLbl').textContent=Math.round(view.scale*100)+'%';
}
function zoomBy(d){view.scale=Math.min(2.5,Math.max(.25,view.scale+d));applyView();persistView();}
function resetView(){view={x:40,y:20,scale:1};applyView();persistView();}
function persistView(){const b=currentBoard(); if(b){b.view={...view}; save();}}

const wrap=document.getElementById('canvasWrap');
wrap.addEventListener('wheel',e=>{
  if(e.ctrlKey||e.metaKey){e.preventDefault();zoomBy(e.deltaY<0?0.08:-0.08);}
  else{view.x-=e.deltaX; view.y-=e.deltaY; applyView();}
},{passive:false});
let panStart=null;
wrap.addEventListener('pointerdown',e=>{
  if(e.target!==wrap && e.target.id!=='canvas' && e.target.id!=='lineLayer') return;
  panStart={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};
  wrap.setPointerCapture(e.pointerId);
});
wrap.addEventListener('pointermove',e=>{
  if(panStart){view.x=panStart.vx+(e.clientX-panStart.x); view.y=panStart.vy+(e.clientY-panStart.y); applyView();}
});
wrap.addEventListener('pointerup',()=>{if(panStart){panStart=null;persistView();}});

/* ---------- RENDER ---------- */
function renderAll(){ renderCanvas(); renderLines(); renderUnsorted(); }
function renderUnsorted(){
  const b=currentBoard();
  const n=b.cards.filter(c=>!c.grouped).length;
  document.getElementById('unsortedBadge').textContent=n+' Unsorted';
}
function tidyUp(){
  const b=currentBoard(); let x=40,y=40,rowH=0,maxW=1400;
  b.cards.forEach(c=>{
    if(x+c.w>maxW){x=40;y+=rowH+24;rowH=0;}
    c.x=x; c.y=y; x+=c.w+24; rowH=Math.max(rowH,c.h);
  });
  save(); renderAll(); toast('Tidied up');
}

function renderCanvas(){
  const canvas=document.getElementById('canvas');
  canvas.innerHTML='';
  const b=currentBoard();
  b.cards.forEach(c=>canvas.appendChild(renderCard(c)));
}
function renderLines(){
  const svg=document.getElementById('lineLayer'); svg.innerHTML='';
  const b=currentBoard();
  (b.lines||[]).forEach(l=>{
    const a=b.cards.find(c=>c.id===l.from), z=b.cards.find(c=>c.id===l.to);
    if(!a||!z) return;
    const x1=a.x+a.w/2, y1=a.y+a.h/2, x2=z.x+z.w/2, y2=z.y+z.h/2;
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',x1); line.setAttribute('y1',y1); line.setAttribute('x2',x2); line.setAttribute('y2',y2);
    line.setAttribute('stroke','#8b93a1'); line.setAttribute('stroke-width','2');
    svg.appendChild(line);
  });
}

/* ---------- LINE TOOL ---------- */
function startLineMode(){
  lineMode=true; lineFrom=null;
  document.getElementById('lineBtn').style.background='#eef0ff';
  toast('Click two cards to connect them');
}
function cardClickedForLine(id){
  if(!lineMode) return false;
  if(!lineFrom){ lineFrom=id; toast('Now click the card to connect to'); return true; }
  const b=currentBoard();
  if(lineFrom!==id) b.lines=[...(b.lines||[]), {id:uid(), from:lineFrom, to:id}];
  lineMode=false; lineFrom=null;
  document.getElementById('lineBtn').style.background='';
  save(); renderLines(); return true;
}

/* ---------- MORE PANEL ---------- */
function toggleMore(){
  const p=document.getElementById('morePanel'), b=document.getElementById('moreBtn');
  const willOpen=!p.classList.contains('open');
  p.classList.toggle('open', willOpen); b.classList.toggle('open', willOpen);
  if(willOpen){ const r=b.getBoundingClientRect(); p.style.top=Math.min(r.top, window.innerHeight-280)+'px'; }
}
document.addEventListener('click',e=>{
  if(!e.target.closest('#moreBtn') && !e.target.closest('#morePanel')) toggleMore_close();
});
function toggleMore_close(){document.getElementById('morePanel').classList.remove('open');document.getElementById('moreBtn').classList.remove('open');}

/* ---------- FILE PICKERS ---------- */
function pickImage(){document.getElementById('fileImage').click();}
function pickUpload(){document.getElementById('fileUpload').click();}
function pickAudio(){document.getElementById('fileAudio').click();}
function pickVideo(){document.getElementById('fileVideo').click();}

function readFile(file,cb){const r=new FileReader(); r.onload=()=>cb(r.result); r.readAsDataURL(file);}

document.getElementById('fileImage').onchange=async function(){
  const f=this.files[0]; this.value=''; if(!f) return;
  try{ const fileId=await storeFile(f); addCard('image',{fileId,fileName:f.name,fileSize:f.size}); toast('Image added'); }
  catch(e){ toast('Could not store this file in browser storage'); }
};
document.getElementById('fileUpload').onchange=async function(){
  const f=this.files[0]; this.value=''; if(!f) return;
  try{ const fileId=await storeFile(f); addCard('document',{fileId,fileName:f.name,fileSize:f.size}); toast('File added'); }
  catch(e){ toast('Could not store this file in browser storage'); }
};
document.getElementById('fileAudio').onchange=async function(){
  const f=this.files[0]; this.value=''; if(!f) return;
  try{ const fileId=await storeFile(f); addCard('audio',{fileId,fileName:f.name,fileSize:f.size}); toast('Audio added'); }
  catch(e){ toast('Could not store this file in browser storage'); }
};
document.getElementById('fileVideo').onchange=async function(){
  const f=this.files[0]; this.value=''; if(!f) return;
  try{ const fileId=await storeFile(f); addCard('video',{fileId,fileName:f.name,fileSize:f.size}); toast('Video added'); }
  catch(e){ toast('Could not store this file in browser storage'); }
};

/* ---------- ADD CARD ---------- */
function addCard(type,extra){
  toggleMore_close();
  const b=currentBoard();
  const center={x:(-view.x+wrap.clientWidth/2)/view.scale-110,y:(-view.y+wrap.clientHeight/2)/view.scale-50};
  const base={id:uid(),type,x:Math.round(center.x+(Math.random()*40-20)),y:Math.round(center.y+(Math.random()*40-20)),
    w:220,h:120,color:COLORS[0],locked:false,grouped:false};
  let card;
  switch(type){
    case 'note': card={...base,h:110,content:''}; break;
    case 'heading': card={...base,w:260,h:70,content:'Heading'}; break;
    case 'todo': card={...base,h:150,items:[{text:'',done:false}]}; break;
    case 'link': card={...base,w:260,h:70,pending:true}; break;
    case 'table': card={...base,w:280,h:160,rows:[['',''],['','']]}; break;
    case 'column': card={...base,w:220,h:200,items:['First item']}; break;
    case 'comment': card={...base,w:240,h:150,items:[]}; break;
    case 'color': card={...base,w:140,h:100,swatch:COLORS[Math.floor(Math.random()*COLORS.length)]}; break;
    case 'map': card={...base,w:300,h:220,embed:`https://maps.google.com/maps?q=New+York&z=12&output=embed`,q:'New York'}; break;
    case 'sketch': card={...base,w:280,h:200,paths:[]}; break;
    case 'image': card={...base,w:260,h:200,src:extra?.src||'',fileId:extra?.fileId||null,fileName:extra?.fileName||'',fileSize:extra?.fileSize||0,caption:''}; break;
    case 'video': card={...base,w:300,h:190,src:extra?.src||'',fileId:extra?.fileId||null,fileName:extra?.fileName||''}; break;
    case 'audio': card={...base,w:240,h:90,src:extra?.src||'',fileId:extra?.fileId||null,fileName:extra?.fileName||''}; break;
    case 'document': card={...base,w:240,h:70,src:extra?.src||'',fileId:extra?.fileId||null,fileName:extra?.fileName||'',fileSize:extra?.fileSize||0}; break;
    case 'board': {
      const nb=mkBoard('Untitled board',b.id); state.boards.push(nb);
      card={...base,w:190,h:150,boardId:nb.id}; break;
    }
  }
  b.cards.push(card); save(); renderAll();
  return card;
}

/* ---------- RENDER A CARD ---------- */
function renderCard(c){
  const el=document.createElement('div');
  el.className='card '+c.type; el.style.left=c.x+'px'; el.style.top=c.y+'px';
  el.style.width=c.w+'px'; el.style.height=c.h+'px'; el.dataset.id=c.id;

  if(c.type!=='boardlink' && c.type!=='board'){
    const head=document.createElement('div'); head.className='ch';
    head.innerHTML=`<span class="swatch-bar" style="background:${c.color||'#ccc'}"></span><span class="tag">${c.type}</span>
      <span class="act">
        <button onclick="cycleColor('${c.id}')" title="Label color"><i class="fa-solid fa-palette"></i></button>
        <button onclick="toggleLock('${c.id}')" title="${c.locked?'Unlock':'Lock'}"><i class="fa-solid ${c.locked?'fa-lock':'fa-lock-open'}"></i></button>
        <button onclick="deleteCard('${c.id}')" title="Delete"><i class="fa-solid fa-trash-can"></i></button>
      </span>`;
    el.appendChild(head);
  }

  const body=document.createElement('div'); body.className='body';

  if(c.type==='note'||c.type==='heading'){
    body.contentEditable=!c.locked; body.setAttribute('data-ph','Type here…');
    body.innerText=c.content||''; body.oninput=()=>{c.content=body.innerText; save();};

  } else if(c.type==='todo'){
    const list=document.createElement('div');
    const renderItems=()=>{
      list.innerHTML='';
      c.items.forEach((it,i)=>{
        const row=document.createElement('div'); row.className='todo-row'+(it.done?' done':'');
        row.innerHTML=`<input type="checkbox" ${it.done?'checked':''}><span contenteditable data-ph="New task">${esc(it.text)}</span>`;
        row.querySelector('input').onchange=e=>{it.done=e.target.checked; save(); renderItems();};
        row.querySelector('span').oninput=e=>{it.text=e.target.innerText; save();};
        list.appendChild(row);
      });
      const add=document.createElement('div'); add.className='add-todo'; add.textContent='+ add item';
      add.onclick=()=>{c.items.push({text:'',done:false}); save(); renderItems();
        const last=list.querySelectorAll('span')[list.querySelectorAll('span').length-1]; if(last) last.focus();};
      list.appendChild(add);
    };
    renderItems(); body.appendChild(list);

  } else if(c.type==='link'){
    if(c.pending){
      body.innerHTML='';
      const wrap2=document.createElement('div'); wrap2.className='link-input';
      wrap2.innerHTML=`<input placeholder="Paste a URL (YouTube, Spotify, or any link)…"><button>Add</button>`;
      const go=()=>{
        const url=wrap2.querySelector('input').value.trim(); if(!url) return;
        applyLink(c,url); save(); renderAll();
      };
      wrap2.querySelector('button').onclick=go;
      wrap2.querySelector('input').onkeydown=e=>{if(e.key==='Enter') go();};
      body.appendChild(wrap2);
      setTimeout(()=>wrap2.querySelector('input').focus(),30);
    } else if(c.embedUrl){
      el.classList.add('embed');
      const ytId=extractYouTube(c.url||'');
      if(ytId){
        const playerUrl=`https://www.youtube.com/embed/${ytId}?rel=0&modestbranding=1&playsinline=1&enablejsapi=1`;
        body.innerHTML=`<div class="youtube-player"><iframe src="${playerUrl}" title="YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="eager" referrerpolicy="strict-origin-when-cross-origin"></iframe><div class="youtube-fallback"><i class="fa-brands fa-youtube"></i><span>Having trouble loading?</span><a href="https://www.youtube.com/watch?v=${ytId}" target="_blank" rel="noopener">Open on YouTube</a></div></div>`;
        const frame=body.querySelector('iframe');
        frame.addEventListener('load',()=>{ body.querySelector('.youtube-fallback')?.classList.add('hidden'); });
      } else {
        body.innerHTML=`<iframe src="${c.embedUrl}" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;web-share" allowfullscreen loading="eager" referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
      }
    } else {
      body.innerHTML=`<a href="${c.url}" target="_blank" rel="noopener">${esc(c.title||c.url)}</a><span style="color:var(--muted);font-size:11px;">${esc(c.url)}</span>`;
    }

  } else if(c.type==='image'){
    el.classList.remove('note');
    body.innerHTML=`<img src="" alt="${esc(c.fileName||'Image')}">`;
    const mediaImg=body.querySelector('img');
    mediaURL(c).then(url=>{if(url){mediaImg.src=url;if(url.startsWith('blob:')){mediaImg.dataset.blobUrl=url;}}});
    const ann=document.createElement('button'); ann.innerHTML='<i class="fa-solid fa-pen"></i> Annotate';
    ann.style.cssText='position:absolute;top:6px;right:6px;z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-size:11px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);';
    ann.onclick=(e)=>{e.stopPropagation(); openAnnotate(c);};
    body.appendChild(ann);
    const cap=document.createElement('div'); cap.className='caption'; cap.contentEditable=true;
    cap.setAttribute('data-ph','Add a caption…'); cap.innerText=c.caption||'';
    cap.oninput=()=>{c.caption=cap.innerText; save();};
    el.appendChild(body); el.appendChild(cap); addDrag(el,c); addResize(el,c); return el;

  } else if(c.type==='video'){
    body.innerHTML=`<video controls playsinline preload="metadata"></video>`;
    const mediaVideo=body.querySelector('video');
    mediaURL(c).then(url=>{if(url){mediaVideo.src=url;if(url.startsWith('blob:'))mediaVideo.dataset.blobUrl=url;mediaVideo.load();}});

  } else if(c.type==='audio'){
    body.innerHTML=`<div style="font-size:24px;"><i class="fa-solid fa-music"></i></div><div style="font-size:11.5px;color:var(--muted);">${esc(c.fileName||'Audio')}</div><audio controls></audio>`;
    const mediaAudio=body.querySelector('audio');
    mediaURL(c).then(url=>{if(url){mediaAudio.src=url;if(url.startsWith('blob:'))mediaAudio.dataset.blobUrl=url;mediaAudio.load();}});

  } else if(c.type==='document'){
    const kb=c.fileSize?Math.round(c.fileSize/1024)+' KB':'';
    body.innerHTML=`<div class="fico"><i class="fa-regular fa-file-lines"></i></div><div style="min-width:0;flex:1;"><div style="font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(c.fileName||'File')}</div><div style="font-size:11px;color:var(--muted);">${kb}</div></div>
      <a class="download-file" href="${c.src||'#'}" download="${esc(c.fileName||'file')}" style="color:var(--accent);font-size:13px;font-weight:700;text-decoration:none;" title="Download"><i class="fa-solid fa-download"></i></a>`;
    const dl=body.querySelector('.download-file');
    if(c.fileId) mediaURL(c).then(url=>{if(url){dl.href=url;dl.dataset.blobUrl=url;}});

  } else if(c.type==='map'){
    el.classList.add('embed');
    body.innerHTML=`<div class="map-tools">
        <button onclick="searchMap('${c.id}')"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
        <button onclick="trackLocation('${c.id}')"><i class="fa-solid fa-location-crosshairs"></i> My location</button>
      </div>
      <iframe src="${c.embed}" loading="lazy"></iframe>`;

  } else if(c.type==='table'){
    const t=document.createElement('table'); t.style.cssText='width:100%;border-collapse:collapse;';
    c.rows.forEach((row,ri)=>{
      const tr=document.createElement('tr');
      row.forEach((cell,ci)=>{
        const td=document.createElement('td'); td.contentEditable=true; td.innerText=cell;
        td.style.cssText='border:1px solid var(--line2);padding:5px 7px;font-size:12.5px;';
        td.oninput=()=>{c.rows[ri][ci]=td.innerText; save();};
        tr.appendChild(td);
      });
      t.appendChild(tr);
    });
    body.appendChild(t);

  } else if(c.type==='column'){
    const list=document.createElement('div');
    const renderItems=()=>{
      list.innerHTML='';
      c.items.forEach((text,i)=>{
        const chip=document.createElement('div'); chip.className='col-chip'; chip.contentEditable=true;
        chip.innerText=text; chip.oninput=()=>{c.items[i]=chip.innerText; save();};
        list.appendChild(chip);
      });
      const add=document.createElement('div'); add.className='col-add'; add.textContent='+ add row';
      add.onclick=()=>{c.items.push(''); save(); renderItems();};
      list.appendChild(add);
    };
    renderItems(); body.appendChild(list);

  } else if(c.type==='comment'){
    const list=document.createElement('div');
    const renderItems=()=>{
      list.innerHTML='';
      c.items.forEach(txt=>{const d=document.createElement('div'); d.className='comment-item'; d.textContent=txt; list.appendChild(d);});
      const add=document.createElement('div'); add.className='comment-add';
      add.innerHTML=`<input placeholder="Write a comment…">`;
      add.querySelector('input').onkeydown=e=>{
        if(e.key==='Enter' && e.target.value.trim()){c.items.push(e.target.value.trim()); e.target.value=''; save(); renderItems();}
      };
      list.appendChild(add);
    };
    renderItems(); body.appendChild(list);

  } else if(c.type==='color'){
    body.style.cssText='background:'+c.swatch+';cursor:pointer;';
    body.onclick=()=>{const i=COLORS.indexOf(c.swatch); c.swatch=COLORS[(i+1)%COLORS.length]; save(); renderAll();};

  } else if(c.type==='sketch'){
    renderSketchBody(el,body,c); addDrag(el,c); addResize(el,c,()=>resizeSketchCanvas(c)); return el;

  } else if(c.type==='boardlink' || c.type==='board'){
    const nb=getBoard(c.boardId);
    el.innerHTML=`<div class="board-card-head"><span class="board-tag">Board</span><span class="board-actions"><button onclick="renameBoardCard(event,'${c.id}')" title="Rename board"><i class="fa-solid fa-pen"></i></button><button class="delete-board" onclick="deleteBoardFromCard(event,'${c.id}')" title="Delete board"><i class="fa-solid fa-trash-can"></i></button></span></div><div class="body"><div class="bthumb"><i class="fa-solid fa-folder-tree"></i></div>
      <div class="btitle" contenteditable>${esc(nb?nb.name:'Board')}</div>
      <div class="bcount">${nb?nb.cards.length:0} card${nb&&nb.cards.length===1?'':'s'}</div></div>`;
    const titleEl=el.querySelector('.btitle');
    titleEl.oninput=()=>{if(nb){nb.name=titleEl.innerText; save(); renderCrumbs();}};
    titleEl.onpointerdown=e=>e.stopPropagation();
    el.querySelector('.board-card-head').onpointerdown=e=>{ if(e.target.closest('button')) e.stopPropagation(); };
    el.onclick=(e)=>{ if(e.target.closest('button') || e.target===titleEl) return; if(cardClickedForLine(c.id)) return; openBoard(c.boardId); };
    addDrag(el,c,true); addResize(el,c); return el;
  }

  el.appendChild(body);
  el.onclick=()=>{ cardClickedForLine(c.id); };
  addDrag(el,c); addResize(el,c);
  return el;
}

function applyLink(c,url){
  c.pending=false; c.url=url;
  const yt=extractYouTube(url), sp=spotifyEmbed(url);
  if(yt){ c.embedUrl=`https://www.youtube.com/embed/${yt}?rel=0&modestbranding=1&playsinline=1&enablejsapi=1`; c.w=Math.max(c.w,320); c.h=Math.max(c.h,190); }
  else if(sp){ c.embedUrl=sp; c.w=Math.max(c.w,300); c.h=Math.max(c.h,152); }
  else { c.title=url.replace(/^https?:\/\//,'').split('/')[0]; c.h=Math.max(c.h,80); }
}
function extractYouTube(url){
  try{
    const u=new URL(url);
    if(u.hostname.includes('youtu.be')) return u.pathname.split('/').filter(Boolean)[0]?.slice(0,11)||null;
    if(u.hostname.includes('youtube.com')){
      if(u.pathname==='/watch') return u.searchParams.get('v');
      if(u.pathname.startsWith('/shorts/')) return u.pathname.split('/')[2]?.slice(0,11)||null;
      if(u.pathname.startsWith('/embed/')) return u.pathname.split('/')[2]?.slice(0,11)||null;
      if(u.pathname.startsWith('/live/')) return u.pathname.split('/')[2]?.slice(0,11)||null;
    }
  }catch(e){}
  const m=String(url).match(/(?:youtu\.be\/|[?&]v=|youtube\.com\/embed\/|youtube\.com\/shorts\/|youtube\.com\/live\/)([A-Za-z0-9_-]{11})/);
  return m?m[1]:null;
}
function spotifyEmbed(url){ const m=url.match(/open\.spotify\.com\/(track|album|playlist|episode|show)\/([A-Za-z0-9]+)/); return m?`https://open.spotify.com/embed/${m[1]}/${m[2]}`:null; }

function searchMap(id){
  const c=currentBoard().cards.find(x=>x.id===id);
  const q=prompt('Search for a place or address',c.q||''); if(!q) return;
  c.q=q; c.embed=`https://maps.google.com/maps?q=${encodeURIComponent(q)}&z=14&output=embed`;
  save(); renderAll();
}
function trackLocation(id){
  if(!navigator.geolocation){toast('Geolocation not supported in this browser');return;}
  toast('Getting your location…');
  navigator.geolocation.getCurrentPosition(pos=>{
    const c=currentBoard().cards.find(x=>x.id===id);
    c.embed=`https://maps.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}&z=15&output=embed`;
    c.q='My location'; save(); renderAll(); toast('Location updated');
  },()=>toast('Could not get your location — check browser permissions'));
}

/* ---------- SKETCH / DRAWING ---------- */
function renderSketchBody(el,body,c){
  const tools=document.createElement('div'); tools.className='sketch-tools';
  const colors=['#1f2937','#ef4444','#3b82f6','#22c55e','#f59e0b'];
  tools.innerHTML=colors.map((cl,i)=>`<div class="sw ${i===0?'sel':''}" data-c="${cl}" style="background:${cl}"></div>`).join('')+
    `<input type="range" min="1" max="12" value="3" id="lw_${c.id}"><button data-act="clear">Clear</button>`;
  body.appendChild(tools);
  const canvasEl=document.createElement('canvas'); canvasEl.className='sketchCanvas';
  body.appendChild(canvasEl);
  el.appendChild(body);
  let color='#1f2937', lw=3, drawing=false, ctx;
  function setup(){
    canvasEl.width=el.clientWidth; canvasEl.height=el.clientHeight-34;
    ctx=canvasEl.getContext('2d'); ctx.lineCap='round'; ctx.lineJoin='round';
    redraw();
  }
  function redraw(){
    ctx.clearRect(0,0,canvasEl.width,canvasEl.height);
    (c.paths||[]).forEach(p=>{
      ctx.strokeStyle=p.color; ctx.lineWidth=p.lw; ctx.beginPath();
      p.pts.forEach((pt,i)=>{ i===0?ctx.moveTo(pt[0],pt[1]):ctx.lineTo(pt[0],pt[1]); });
      ctx.stroke();
    });
  }
  tools.querySelectorAll('.sw').forEach(sw=>sw.onclick=()=>{tools.querySelectorAll('.sw').forEach(s=>s.classList.remove('sel'));sw.classList.add('sel');color=sw.dataset.c;});
  tools.querySelector('input[type=range]').oninput=e=>lw=+e.target.value;
  tools.querySelector('[data-act=clear]').onclick=()=>{c.paths=[];save();redraw();};
  let currentPath=null;
  canvasEl.addEventListener('pointerdown',e=>{
    e.stopPropagation(); drawing=true; const r=canvasEl.getBoundingClientRect();
    currentPath={color,lw,pts:[[e.clientX-r.left,e.clientY-r.top]]};
    canvasEl.setPointerCapture(e.pointerId);
  });
  canvasEl.addEventListener('pointermove',e=>{
    if(!drawing) return; const r=canvasEl.getBoundingClientRect();
    currentPath.pts.push([e.clientX-r.left,e.clientY-r.top]); redraw();
    ctx.strokeStyle=currentPath.color; ctx.lineWidth=currentPath.lw; ctx.beginPath();
    currentPath.pts.forEach((pt,i)=>{i===0?ctx.moveTo(pt[0],pt[1]):ctx.lineTo(pt[0],pt[1]);}); ctx.stroke();
  });
  canvasEl.addEventListener('pointerup',()=>{
    if(!drawing) return; drawing=false;
    c.paths=[...(c.paths||[]),currentPath]; currentPath=null; save();
  });
  setTimeout(setup,0);
  el._resizeSketch=setup;
}
function resizeSketchCanvas(c){
  const el=document.querySelector(`.card[data-id="${c.id}"]`);
  if(el && el._resizeSketch) el._resizeSketch();
}

/* image annotate overlay */
function openAnnotate(c){
  const el=document.querySelector(`.card[data-id="${c.id}"] .body`);
  if(el.querySelector('.annotateOverlay')) return;
  const img=el.querySelector('img');
  const overlay=document.createElement('canvas'); overlay.className='annotateOverlay';
  overlay.style.cssText='position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none;';
  overlay.width=el.clientWidth; overlay.height=el.clientHeight;
  el.style.position='relative'; el.appendChild(overlay);
  const ctx=overlay.getContext('2d'); let drawing=false;
  const bar=document.createElement('div');
  bar.style.cssText='position:absolute;top:6px;left:6px;right:6px;display:flex;gap:6px;z-index:9;background:color-mix(in srgb, var(--panel) 92%, transparent);padding:4px 6px;border-radius:8px;';
  bar.innerHTML=`<button style="border:0;background:#1f2937;color:#fff;border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;">Done</button>
    <button style="border:0;background:#e5e7eb;border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;">Clear</button>`;
  el.appendChild(bar);
  ctx.strokeStyle='#ef4444'; ctx.lineWidth=3; ctx.lineCap='round';
  overlay.addEventListener('pointerdown',e=>{drawing=true; const r=overlay.getBoundingClientRect(); ctx.beginPath(); ctx.moveTo(e.clientX-r.left,e.clientY-r.top);});
  overlay.addEventListener('pointermove',e=>{if(!drawing)return; const r=overlay.getBoundingClientRect(); ctx.lineTo(e.clientX-r.left,e.clientY-r.top); ctx.stroke();});
  overlay.addEventListener('pointerup',()=>drawing=false);
  bar.children[1].onclick=()=>ctx.clearRect(0,0,overlay.width,overlay.height);
  bar.children[0].onclick=()=>{
    const off=document.createElement('canvas'); off.width=img.naturalWidth; off.height=img.naturalHeight;
    const octx=off.getContext('2d');
    octx.drawImage(img,0,0,off.width,off.height);
    octx.drawImage(overlay,0,0,overlay.width,overlay.height,0,0,off.width,off.height);
    c.src=off.toDataURL('image/png'); save(); renderAll();
  };
}

/* ---------- DRAG / RESIZE ---------- */
function addDrag(el,c,wholeCard){
  const handle=wholeCard?el:el.querySelector('.ch');
  if(!handle) return;
  handle.addEventListener('pointerdown',e=>{
    if(c.locked || lineMode) return;
    if(e.target.closest('.act')||e.target.closest('.sketch-tools')||e.target.closest('.map-tools')||e.target.closest('.link-input')) return;
    e.stopPropagation();
    const startX=e.clientX, startY=e.clientY, ox=c.x, oy=c.y; let moved=false;
    el.classList.add('dragging');
    function move(ev){
      moved=true;
      c.x=ox+(ev.clientX-startX)/view.scale; c.y=oy+(ev.clientY-startY)/view.scale;
      el.style.left=c.x+'px'; el.style.top=c.y+'px'; renderLines();
    }
    function up(){document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);
      el.classList.remove('dragging'); if(moved) save();}
    document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
  });
}
function addResize(el,c,onResize){
  const r=document.createElement('div'); r.className='resize'; el.appendChild(r);
  r.addEventListener('pointerdown',e=>{
    e.stopPropagation();
    const startX=e.clientX, startY=e.clientY, ow=c.w, oh=c.h;
    function move(ev){
      c.w=Math.max(150,ow+(ev.clientX-startX)/view.scale); c.h=Math.max(64,oh+(ev.clientY-startY)/view.scale);
      el.style.width=c.w+'px'; el.style.height=c.h+'px'; if(onResize) onResize();
    }
    function up(){document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);save();renderLines();}
    document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
  });
}
function cycleColor(id){const c=currentBoard().cards.find(x=>x.id===id);const i=COLORS.indexOf(c.color);c.color=COLORS[(i+1)%COLORS.length];save();renderAll();}
function toggleLock(id){const c=currentBoard().cards.find(x=>x.id===id);c.locked=!c.locked;save();renderAll();}
function renameBoardCard(e,id){
  e.stopPropagation();
  const card=currentBoard().cards.find(x=>x.id===id);
  const b=card?getBoard(card.boardId):null;
  if(!b) return;
  const name=prompt('Board name',b.name);
  if(name&&name.trim()){b.name=name.trim();save();renderAll();renderCrumbs();}
}
async function deleteBoardFromCard(e,id){
  e.stopPropagation();
  const parent=currentBoard();
  const card=parent.cards.find(x=>x.id===id);
  if(!card) return;
  const b=getBoard(card.boardId);
  if(!b) return;
  if(b.id===state.boards[0].id && !b.parentId){toast('The Home board cannot be deleted');return;}
  if(!confirm(`Delete board "${b.name}" and all of its cards?`)) return;
  const idx=parent.cards.findIndex(x=>x.id===id);
  if(idx>=0) parent.cards.splice(idx,1);
  const bi=state.boards.findIndex(x=>x.id===b.id);
  if(bi>=0) state.boards.splice(bi,1);
  state.trash.push({type:'board',data:b,deletedAt:Date.now()});
  if(state.currentId===b.id) state.currentId=b.parentId||state.boards[0]?.id;
  save();renderCrumbs();renderAll();toast('Board moved to trash');
}
async function cleanCurrentBoard(){
  const b=currentBoard();
  if(!b) return;
  if(!b.cards.length){toast('This board is already empty');return;}
  if(!confirm(`Move all ${b.cards.length} card${b.cards.length===1?'':'s'} on "${b.name}" to Trash?`)) return;
  b.cards.forEach(c=>state.trash.push({type:'card',boardId:b.id,data:c,deletedAt:Date.now()}));
  b.cards=[];
  b.lines=[];
  save();renderAll();toast('Current board cleaned');
}
function deleteCard(id){
  const b=currentBoard(); const idx=b.cards.findIndex(x=>x.id===id);
  const [c]=b.cards.splice(idx,1);
  b.lines=(b.lines||[]).filter(l=>l.from!==id&&l.to!==id);
  state.trash.push({type:'card',boardId:b.id,data:c,deletedAt:Date.now()});
  save(); renderAll(); toast('Moved to trash');
}

/* ---------- TRASH ---------- */
function openTrash(){
  const body=document.getElementById('trashBody'); body.innerHTML='';
  if(state.trash.length===0) body.innerHTML='<div class="empty-state"><i class="fa-regular fa-trash-can" style="font-size:28px;margin-bottom:10px;"></i><div>Trash is empty.</div></div>';
  [...state.trash].reverse().forEach(t=>{
    const row=document.createElement('div'); row.className='trash-row';
    const label=t.type==='board'?('Board: '+t.data.name):('Card: '+t.data.type);
    row.innerHTML=`<span>${esc(label)}</span>`;
    const restore=document.createElement('button'); restore.className='btn'; restore.textContent='Restore';
    restore.onclick=()=>{restoreTrash(t); openTrash();};
    row.appendChild(restore); body.appendChild(row);
  });
  document.getElementById('trashModal').classList.add('open');
}
async function deleteAllTrash(){
  if(!state.trash.length){toast('Trash is already empty');return;}
  if(!confirm('Permanently delete all items in Trash? This cannot be undone.')) return;
  const ids=[];
  const collectFileIds=(value)=>{
    if(!value || typeof value!=='object') return;
    if(value.fileId) ids.push(value.fileId);
    if(Array.isArray(value)) value.forEach(collectFileIds);
    else Object.values(value).forEach(collectFileIds);
  };
  state.trash.forEach(t=>collectFileIds(t.data));
  for(const id of [...new Set(ids)]) await deleteStoredFile(id);
  state.trash=[];
  save(); openTrash(); toast('Trash permanently cleared');
}
function restoreTrash(t){
  const i=state.trash.indexOf(t); state.trash.splice(i,1);
  if(t.type==='board') state.boards.push(t.data);
  else {const b=getBoard(t.boardId)||currentBoard(); b.cards.push(t.data);}
  save(); renderAll(); toast('Restored');
}
function closeModal(id){document.getElementById(id).classList.remove('open');}

/* ---------- THEME ---------- */
function applyTheme(){
  const dark=localStorage.getItem('boards_theme')==='dark';
  document.body.classList.toggle('dark',dark);
  const btn=document.getElementById('themeBtn');
  if(btn) btn.innerHTML=`<i class="fa-solid ${dark?'fa-sun':'fa-moon'}"></i>`;
  btn?.setAttribute('title',dark?'Switch to light mode':'Switch to dark mode');
}
function toggleTheme(){
  const dark=!document.body.classList.contains('dark');
  localStorage.setItem('boards_theme',dark?'dark':'light');
  applyTheme();
  toast(dark?'Dark mode enabled':'Light mode enabled');
}

/* ---------- INIT ---------- */

applyTheme(); renderCrumbs(); renderAll(); applyView();
</script>
